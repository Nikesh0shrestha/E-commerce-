{% extends 'base.html' %}

{% block content %}
<section class="section-content padding-y bg">
    <div class="container">
        <div class="row">
            {% include 'includes/dashboard_sidebar.html' %} 
            <main class="col-md-9">
                <article class="card">
                    <header class="card-header">
                        <strong class="d-inline-block mr-3">Supplier Control Panel</strong>
                    </header>
                    <div class="card-body">
                        <div class="row"> 
                            <div class="col-md-12">
                                <h4>Welcome, {{user.full_name}}!</h4>
                                <p>Manage your products and track your sales below.</p>
                                <hr>

                                <a href="{% url 'add_product' %}" class="btn btn-success mb-3">+ Add New Product</a>
                                
                                <div class="row mt-4">
                                    <div class="col-md-4">
                                        <div class="card text-center p-3">
                                            <h5>Total Products</h5>
                                            <h3>{{ products_count }}</h3>
                                            <a href="{% url 'supplier_products' %}" class="btn btn-sm btn-outline-primary">View Products</a>
                                        </div>
                                    </div>
                                    <div class="col-md-4">
                                        <div class="card text-center p-3">
                                            <h5>New Orders</h5>
                                            <h3>0</h3> 
                                            <button class="btn btn-sm btn-outline-secondary" disabled>Coming Soon</button>
                                        </div>
                                    </div>
                                </div>
                                </div>
                        </div> 
                    </div> 
                </article> 
            </main>
        </div>
    </div>
</section>
{% endblock %}
